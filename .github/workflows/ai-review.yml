name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  models: read

jobs:
  ai-review:
    name: AI Review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run AI Review and comment on PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BASE_REF: ${{ github.base_ref }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.number }}
          SYSTEM_PROMPT: >
            Ти досвідчений Python-розробник і код-рев'юер. Проаналізуй git diff
            pull request-а та вкажи: 1) логічні помилки, 2) проблеми читабельності
            та неймінгу, 3) відсутні тести. Відповідай стисло українською мовою.
        run: |
          python - << 'EOF'
          import json
          import os
          import subprocess
          import urllib.error
          import urllib.request

          base = os.environ["BASE_REF"]
          diff = subprocess.check_output(
              ["git", "diff", f"origin/{base}...HEAD"], text=True
          )
          if not diff.strip():
              print("Empty diff, skipping AI review.")
              raise SystemExit(0)

          system_prompt = os.environ["SYSTEM_PROMPT"]
          user_prompt = f"Ось diff змін у Pull Request:\n```diff\n{diff[:12000]}\n```"
          gemini_key = os.environ.get("GEMINI_API_KEY", "").strip()

          if gemini_key:
              url = "https://generativelanguage.googleapis.com/v1beta/openai/chat/completions"
              headers = {
                  "Content-Type": "application/json",
                  "Authorization": f"Bearer {gemini_key}",
              }
              model = "gemini-2.5-flash"
          else:
              url = "https://models.github.ai/inference/chat/completions"
              headers = {
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              }
              model = "openai/gpt-4o-mini"

          payload = {
              "model": model,
              "messages": [
                  {"role": "system", "content": system_prompt},
                  {"role": "user", "content": user_prompt},
              ],
          }

          req = urllib.request.Request(
              url, data=json.dumps(payload).encode("utf-8"), headers=headers
          )
          try:
              with urllib.request.urlopen(req, timeout=60) as resp:
                  raw = resp.read().decode("utf-8")
                  print("HTTP status:", resp.status, "Body len:", len(raw))
          except urllib.error.HTTPError as e:
              print("HTTP Error:", e.code, e.read().decode("utf-8", errors="replace"))
              raise

          data = json.loads(raw)
          review_text = data["choices"][0]["message"]["content"]

          repo = os.environ["REPO"]
          pr_num = os.environ["PR_NUMBER"]
          comment_req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/issues/{pr_num}/comments",
              data=json.dumps(
                  {"body": f"### 🤖 AI Code Review\n\n{review_text}"}
              ).encode("utf-8"),
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          with urllib.request.urlopen(comment_req, timeout=30) as resp:
              print("Posted comment status:", resp.status)
          EOF